<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CENIZA</title>
<meta name="description" content="CENIZA: una brasa que sube. Toca el lado libre. La chimenea se cierra.">
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;background:#100806;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" aria-label="Ceniza"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const FONT = {
    A:0x2bed,B:0x6bae,C:0x3923,D:0x6b6e,E:0x79a7,F:0x79a4,G:0x396b,H:0x5bed,I:0x7497,J:0x126a,
    K:0x5bad,L:0x4927,M:0x5fed,N:0x6b6d,O:0x2b6a,P:0x6ba4,Q:0x2b59,R:0x6bad,S:0x388e,T:0x7492,
    U:0x5b6f,V:0x5b6a,W:0x5bfd,X:0x5aad,Y:0x5a92,Z:0x72a7,
    0:0x7b6f,1:0x2c97,2:0x73e7,3:0x73cf,4:0x5bc9,5:0x79cf,6:0x79ef,7:0x7249,8:0x7bef,9:0x7bcf
  };
  const INK = "#fff3e6";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let vw = 800, vh = 600;
  let mode = "title";
  let h = 0, px = 0.5, vx = 0, inv = 0, score = 0, best = 0, newBest = false;
  let dying = 0, shake = 0, flash = 0, muted = false, tAll = 0, demo = 200, nearLock = 0, dartLock = 0;
  const parts = [];
  const trail = [];
  let actx, master, crackle, filt;
  try { best = +localStorage.getItem("ceniza-best") || 0; } catch (e) {}
  function saveBest() { try { localStorage.setItem("ceniza-best", String(best)); } catch (e) {} }
  function emberY() { return vh * 0.66; }

  function boot() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.72;
      master.connect(actx.destination);
      const n = actx.sampleRate * 2;
      const buf = actx.createBuffer(1, n, actx.sampleRate);
      const d = buf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < n; i++) { b = b * 0.996 + (Math.random() * 2 - 1) * 0.02; d[i] = b * 4; }
      const src = actx.createBufferSource();
      src.buffer = buf; src.loop = true;
      filt = actx.createBiquadFilter();
      filt.type = "bandpass"; filt.frequency.value = 320; filt.Q.value = 0.6;
      crackle = actx.createGain(); crackle.gain.value = 0.045;
      src.connect(filt); filt.connect(crackle); crackle.connect(master);
      src.start();
    }
    actx.resume();
    master.gain.value = muted ? 0 : 0.72;
  }
  function tone(freq, dur, type, vol, to) {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, freq), t);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(1, to), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function puff(dur, vol) {
    if (!actx || muted) return;
    const len = Math.max(1, (actx.sampleRate * dur) | 0);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = actx.createBufferSource();
    const f = actx.createBiquadFilter();
    const g = actx.createGain();
    s.buffer = buf; f.type = "lowpass"; f.frequency.value = 900; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }

  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    vw = innerWidth; vh = innerHeight;
    canvas.width = Math.max(1, (vw * dpr) | 0);
    canvas.height = Math.max(1, (vh * dpr) | 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function tide(hh) { return Math.min(1, Math.max(0, hh) / 3600); }

  function wallsAt(hh) {
    const t = tide(hh);
    const half = 0.3 - t * 0.13;
    const sway = Math.sin(hh * 0.0031) * (0.04 + t * 0.14) + Math.sin(hh * 0.0064 + 1.7) * t * 0.045;
    let mid = 0.5 + sway;
    mid = Math.max(half + 0.04, Math.min(1 - half - 0.04, mid));
    let L = mid - half, R = mid + half;
    if (t > 0.12) {
      const period = 620 - t * 200;
      const u = (hh % period) / period;
      if (u > 0.42 && u < 0.72) {
        const k = (u - 0.42) / 0.3;
        const amt = Math.sin(k * Math.PI) * (0.025 + t * 0.04);
        if (((hh / period) | 0) % 2) L += amt; else R -= amt;
      }
    }
    if (R - L < 0.15) { const m = (L + R) / 2; L = m - 0.075; R = m + 0.075; }
    return [L, R];
  }

  function burst(x, y, n, speed, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28;
      const v = speed * (0.35 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.4, max: 0.75, c: color, s: 1 + Math.random() * 2 });
    }
  }

  function kill() {
    if (mode !== "play") return;
    mode = "dying";
    dying = 0.62;
    score = (h / 8) | 0;
    shake = reduce ? 0 : 16;
    flash = 0.5;
    burst(px * vw, emberY(), 36, 220, "#fff1dd");
    burst(px * vw, emberY(), 16, 90, "#ff6a2a");
    tone(160, 0.4, "sawtooth", 0.06, 36);
    puff(0.28, 0.12);
    newBest = score > best;
    if (newBest) {
      best = score; saveBest();
      setTimeout(() => tone(523, 0.1, "triangle", 0.07, 784), 160);
      setTimeout(() => tone(880, 0.16, "sine", 0.05), 300);
    }
  }

  function dart(side) {
    if (mode !== "play" || dartLock > 0) return;
    vx = side * (1.25 + tide(h) * 0.2);
    dartLock = 0.08;
    burst(px * vw, emberY(), 7, 80, "#ffd0a0");
    tone(180, 0.06, "sine", 0.05, 70);
    puff(0.05, 0.06);
  }

  function awaySide() {
    const w = wallsAt(h);
    return (px - w[0]) < (w[1] - px) ? 1 : -1;
  }

  function start() {
    boot();
    mode = "play";
    h = 0; px = 0.5; vx = 0; inv = 1.05; score = 0; newBest = false;
    dying = 0; shake = 0; flash = 0; nearLock = 0; dartLock = 0;
    trail.length = 0;
    for (let i = parts.length - 1; i >= 0; i--) if (!parts[i].ash) parts.splice(i, 1);
  }

  function update(dt) {
    tAll += dt;
    dartLock = Math.max(0, dartLock - dt);
    nearLock = Math.max(0, nearLock - dt);
    shake = Math.max(0, shake - dt * 30);
    if (Math.random() < dt * 14) {
      parts.push({
        x: Math.random() * vw, y: -4,
        vx: (Math.random() - 0.5) * 12, vy: 18 + Math.random() * 30,
        life: 2.2 + Math.random(), max: 3, c: "#e7b08a", s: 1.1, ash: 1
      });
    }
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (!p.ash) { p.vx *= 0.98; p.vy = p.vy * 0.98 + 40 * dt; }
    }
    while (parts.length > 140) parts.shift();
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);

    if (mode === "title") { demo = 220 + (Math.sin(tAll * 0.5) * 0.5 + 0.5) * 640; return; }
    if (mode === "dying") { dying -= dt; if (dying <= 0) mode = "dead"; return; }
    if (mode === "dead") return;

    inv = Math.max(0, inv - dt);
    const rise = (170 + tide(h) * 250) * dt;
    const steps = Math.max(1, Math.ceil(rise / 4));
    for (let i = 0; i < steps; i++) {
      px += vx * (dt / steps);
      h += rise / steps;
      const w = wallsAt(h);
      const rad = 11 / vw;
      if (inv <= 0 && (px < w[0] + rad || px > w[1] - rad)) { kill(); break; }
      if (mode !== "play") break;
      const dist = Math.min(px - w[0], w[1] - px) * vw;
      if (dist < 26 && nearLock <= 0) {
        nearLock = 0.18;
        shake = Math.max(shake, reduce ? 0 : 2.4);
        burst(px * vw, emberY(), 4, 50, "#fff6ea");
        tone(980 + dist * 8, 0.03, "square", 0.025);
      }
    }
    vx *= Math.exp(-6.8 * dt);
    score = (h / 8) | 0;
    trail.push(px);
    if (trail.length > 36) trail.shift();
    if (actx && filt) filt.frequency.setTargetAtTime(260 + tide(h) * 1100, actx.currentTime, 0.2);
    if (actx && crackle) crackle.gain.setTargetAtTime(muted ? 0 : 0.03 + tide(h) * 0.04, actx.currentTime, 0.3);
  }

  function drawText(str, x, y, s, color, align) {
    str = String(str).toUpperCase();
    s |= 0;
    const width = str.length * 4 * s - s;
    x = Math.round(align === "center" ? x - width / 2 : align === "right" ? x - width : x);
    y = Math.round(y);
    ctx.fillStyle = color;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]];
      if (g) {
        for (let p = 0; p < 15; p++) if (g & (1 << (14 - p))) ctx.fillRect(x + (p % 3) * s, y + ((p / 3) | 0) * s, s, s);
      }
      x += 4 * s;
    }
  }

  function drawEmber(x, y, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(h * 0.01 + tAll);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ff7a32";
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(9, -2); ctx.lineTo(5, 9); ctx.lineTo(-6, 8); ctx.lineTo(-10, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#fff6ea";
    ctx.beginPath();
    ctx.arc(-1, -2, 3.3, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  function drawSpeaker() {
    ctx.save();
    ctx.translate(vw - 32, 16);
    ctx.fillStyle = muted ? "#6a5348" : INK;
    ctx.fillRect(0, 4, 3, 5);
    ctx.beginPath();
    ctx.moveTo(3, 4); ctx.lineTo(8, 1); ctx.lineTo(8, 12); ctx.lineTo(3, 9);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = muted ? "#6a5348" : INK;
    ctx.lineWidth = 1.3;
    if (muted) { ctx.beginPath(); ctx.moveTo(11, 2); ctx.lineTo(18, 13); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(8, 6.5, 5, -0.8, 0.8); ctx.stroke(); }
    ctx.restore();
  }

  function drawShaft(hh) {
    const ey = emberY();
    const yTop = hh + vh * 0.92;
    const yBot = hh - vh * 0.48;
    ctx.beginPath();
    ctx.moveTo(-4, -30);
    for (let yy = yTop; yy >= yBot; yy -= 9) ctx.lineTo(wallsAt(yy)[0] * vw, ey - (yy - hh));
    ctx.lineTo(-4, vh + 30);
    ctx.closePath();
    ctx.fillStyle = "#2a1812";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(vw + 4, -30);
    for (let yy = yTop; yy >= yBot; yy -= 9) ctx.lineTo(wallsAt(yy)[1] * vw, ey - (yy - hh));
    ctx.lineTo(vw + 4, vh + 30);
    ctx.closePath();
    ctx.fill();

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalCompositeOperation = "lighter";
    for (const side of [0, 1]) {
      ctx.beginPath();
      let first = true;
      for (let yy = yTop; yy >= yBot; yy -= 9) {
        const x = wallsAt(yy)[side] * vw;
        const sy = ey - (yy - hh);
        if (first) { ctx.moveTo(x, sy); first = false; } else ctx.lineTo(x, sy);
      }
      ctx.strokeStyle = "rgba(255,100,40,0.62)";
      ctx.lineWidth = 22;
      ctx.stroke();
      ctx.strokeStyle = "#ffd7b0";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "rgba(0,0,0,0.28)";
    ctx.lineWidth = 1;
    for (let yy = yBot; yy < yTop; yy += 22) {
      const w = wallsAt(yy);
      const sy = ey - (yy - hh);
      ctx.beginPath();
      ctx.moveTo(0, sy); ctx.lineTo(w[0] * vw - 1, sy);
      ctx.moveTo(w[1] * vw + 1, sy); ctx.lineTo(vw, sy);
      ctx.stroke();
    }
  }

  function draw() {
    const hh = mode === "title" ? demo : h;
    ctx.save();
    if (shake > 0.4) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.fillStyle = "#100806";
    ctx.fillRect(-20, -20, vw + 40, vh + 40);
    drawShaft(hh);

    const ex = (mode === "title" ? 0.5 : px) * vw;
    const ey = emberY() + (mode === "title" ? Math.sin(tAll * 2) * 5 : 0);
    if (mode === "play" && trail.length > 2) {
      ctx.beginPath();
      for (let i = 0; i < trail.length; i++) {
        const x = trail[i] * vw;
        const y = ey + (trail.length - 1 - i) * 5;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(255,170,90,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 70);
    glow.addColorStop(0, "rgba(255,140,50,0.45)");
    glow.addColorStop(1, "rgba(255,140,50,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(ex - 80, ey - 80, 160, 160);

    const visible = mode !== "dying" && (mode !== "play" || inv <= 0 || Math.sin(tAll * 28) > 0);
    if (visible && mode !== "dead") drawEmber(ex, ey, 1);

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.max || 1)));
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;
    const vg = ctx.createRadialGradient(vw / 2, vh / 2, vh * 0.2, vw / 2, vh / 2, vh * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, vw, vh);
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,220,180," + flash.toFixed(3) + ")";
      ctx.fillRect(0, 0, vw, vh);
      flash = Math.max(0, flash - 0.02);
    }

    if (mode === "play" || mode === "dying") {
      const col = best > 0 && score > best ? "#ffd39a" : INK;
      drawText(score, 18, 16, 5, col, "left");
      if (best > 0) drawText("MEJOR " + best, 18, 46, 2, "#c4aa96", "left");
      if (mode === "play" && h < 780) {
        ctx.globalAlpha = 0.85;
        drawText("TOCA EL LADO", vw / 2, vh - 46, 3, "#ffd7b0", "center");
        ctx.globalAlpha = 1;
      }
    }

    if (mode === "title") {
      const ps = Math.max(6, Math.min(16, (Math.min(vw, vh) / 36) | 0));
      const y0 = vh * 0.36;
      const plate = Math.min(460, vw - 24);
      ctx.fillStyle = "rgba(8,4,3,0.5)";
      ctx.fillRect((vw - plate) / 2, y0 - 14, plate, ps * 5 + 78);
      drawText("CENIZA", vw / 2, y0, ps, INK, "center");
      drawText("TOCA EL LADO", vw / 2, y0 + ps * 5 + 16, 3, "#ffc898", "center");
      ctx.globalAlpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(tAll * 3));
      drawText("TOCA", vw / 2, y0 + ps * 5 + 42, 3, INK, "center");
      ctx.globalAlpha = 1;
    }

    if (mode === "dead") {
      const ps = Math.max(7, Math.min(18, (Math.min(vw, vh) / 28) | 0));
      const plate = Math.min(420, vw - 24);
      ctx.fillStyle = "rgba(8,4,3,0.66)";
      ctx.fillRect((vw - plate) / 2, vh * 0.26, plate, vh * 0.5);
      if (newBest) drawText("NUEVO", vw / 2, vh * 0.3, 3, "#ffd39a", "center");
      drawText(newBest ? "MEJOR" : "FRIO", vw / 2, vh * 0.36, 4, "#ffb07a", "center");
      drawText(score, vw / 2, vh * 0.46, ps, INK, "center");
      if (best > 0) drawText("MEJOR " + best, vw / 2, vh * 0.46 + ps * 5 + 12, 3, "#c4aa96", "center");
      ctx.globalAlpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(tAll * 3));
      drawText("TOCA", vw / 2, vh * 0.74, 3, INK, "center");
      ctx.globalAlpha = 1;
    }
    drawSpeaker();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!frame.last) frame.last = now;
    let dt = (now - frame.last) / 1000;
    frame.last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    draw();
  }

  function xy(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function inSpeaker(x, y) { return x > vw - 50 && y < 44; }

  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const [x, y] = xy(e);
    if (inSpeaker(x, y)) {
      muted = !muted;
      if (!actx) boot();
      if (master) master.gain.value = muted ? 0 : 0.72;
      return;
    }
    if (mode === "title" || mode === "dead") { start(); return; }
    if (mode === "play") dart(x < px * vw ? -1 : 1);
  }, { passive: false });

  addEventListener("keydown", (e) => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === " " || k.startsWith("arrow")) e.preventDefault();
    if (k === "m") {
      muted = !muted;
      if (!actx) boot();
      if (master) master.gain.value = muted ? 0 : 0.72;
      return;
    }
    if (mode === "title" || mode === "dead") {
      if (k === " " || k === "enter" || k === "arrowleft" || k === "arrowright" || k === "a" || k === "d") start();
      return;
    }
    if (mode !== "play") return;
    if (k === "arrowleft" || k === "a") dart(-1);
    else if (k === "arrowright" || k === "d") dart(1);
    else if (k === " " || k === "enter") dart(awaySide());
  });
  addEventListener("resize", resize);
  document.addEventListener("visibilitychange", () => {
    if (master) master.gain.value = document.hidden || muted ? 0 : 0.72;
  });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
